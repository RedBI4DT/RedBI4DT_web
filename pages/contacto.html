<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Red BI4DT</title>
  <link rel="icon" type="image/png" href="../assets/images/logo_red/logo_icon.png">
  <link rel="stylesheet" href="../styles/index.css">
  <link rel="stylesheet" href="../styles/contacto.css">
</head>
<body class="contacto-page">

  <!-- Componente Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Contenido Principal -->
  <main class="page-content page-full">

    <!-- Main Contact Info & Form -->
    <section class="contacto-main-section">

      <!-- Tarjeta del Formulario Centrada -->
      <div class="contacto-form-wrapper">
        <form 
          class="contacto-form" 
          id="contacto-form" 
          action="https://forms.zohopublic.com/rodrigochacon2064gm1/form/BI4DTForm/formperma/BGlaAUKLfSxIl_c7N6xYno3IpwBKZ0tTjXKVlyS05Y8/htmlRecords/submit" 
          name="form" 
          method="POST" 
          accept-charset="UTF-8" 
          enctype="multipart/form-data" 
          target="zoho-submit-frame"
          novalidate>
          
          <!-- Campos Ocultos de Configuración de Zoho Forms -->
          <input type="hidden" name="zf_referrer_name" value="">
          <input type="hidden" name="zf_redirect_url" value="">
          <input type="hidden" name="zc_gad" value="">

          <div class="contacto-row">
            <div class="contacto-group" id="group-nombre">
              <label class="contacto-form-label" for="nombre">Nombre *</label>
              <input type="text" id="nombre" name="Name_First" maxlength="255" class="contacto-input" placeholder="Tu nombre" required>
              <span class="contacto-field-error" id="error-nombre"></span>
            </div>
            <div class="contacto-group" id="group-apellido">
              <label class="contacto-form-label" for="apellido">Apellido *</label>
              <input type="text" id="apellido" name="Name_Last" maxlength="255" class="contacto-input" placeholder="Tu apellido" required>
              <span class="contacto-field-error" id="error-apellido"></span>
            </div>
          </div>

          <div class="contacto-group" id="group-correo">
            <label class="contacto-form-label" for="correo">Correo Electrónico *</label>
            <input type="email" id="correo" name="Email" maxlength="255" class="contacto-input" placeholder="ejemplo@correo.com" required>
            <span class="contacto-field-error" id="error-correo"></span>
          </div>

          <div class="contacto-group" id="group-mensaje">
            <label class="contacto-form-label" for="mensaje">Mensaje *</label>
            <textarea id="mensaje" name="MultiLine" maxlength="65535" class="contacto-input contacto-textarea" placeholder="Escribe tu mensaje o consulta aquí..." required></textarea>
            <span class="contacto-field-error" id="error-mensaje"></span>
          </div>

          <!-- Mensaje de estado / feedback accesible -->
          <div id="contacto-status" class="contacto-status" role="alert" style="display: none;"></div>

          <button type="submit" class="contacto-submit-btn" id="contacto-submit-btn">
            <span>Enviar Mensaje</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>

        <!-- Iframe oculto para procesar el envío sin recargar la página ni sufrir bloqueos CORS -->
        <iframe name="zoho-submit-frame" id="zoho-submit-frame" title="Envío de formulario Zoho" style="display:none;" tabindex="-1" aria-hidden="true"></iframe>
      </div>

    </section>

  </main>

  <!-- Componente Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="../scripts/loadComponents.js"></script>
  <script src="../scripts/contact.js"></script>
</body>
</html>
