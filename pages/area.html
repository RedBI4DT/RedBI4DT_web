<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eje Científico - Red BI4DT</title>
  <meta name="description" content="Detalle del eje científico de la Red BI4DT: descripción, temas de investigación y proyectos relacionados.">
  <link rel="icon" type="image/png" href="../assets/images/logo_red/logo_icon.png">
  <link rel="stylesheet" href="../styles/index.css">
  <link rel="stylesheet" href="../styles/area.css">
</head>
<body>

  <!-- Componente Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Contenido Principal -->
  <main class="page-content page-full" id="area-main">

    <!-- Hero del Área -->
    <section class="area-hero-section" id="area-hero">
      <div class="area-hero-content">
        <a href="lineas.html" class="area-back-link" id="area-back-link">
          <i class="fa-solid fa-arrow-left"></i> Líneas de Investigación
        </a>
        <h1 class="area-hero-nombre" id="area-hero-nombre">Cargando...</h1>
        <p class="area-hero-desc" id="area-hero-desc"></p>
      </div>
    </section>

    <!-- Sección: Investigadores del Eje -->
    <section class="area-investigadores-section" id="area-investigadores-section">
      <div class="area-section-container">
        <div class="area-section-header">
          <h2 class="section-title-navy area-section-title">Integrantes</h2>
          <a href="equipo.html" class="area-ver-todos-link" id="area-ver-equipo-link">
            Ver todo el equipo <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
        <div class="area-investigadores-grid" id="area-investigadores-grid">
          <!-- Se renderizan dinámicamente con scripts/area.js -->
        </div>
      </div>
    </section>

    <!-- Sección: Proyectos Relacionados (Vista en Lista Limpia) -->
    <section class="area-proyectos-section">
      <div class="area-section-container">
        <div class="area-proyectos-header-bar">
          <div class="area-proyectos-header-left">
            <h2 class="section-title-navy area-section-title">
              Proyectos Relacionados <span id="area-proyectos-total-badge" class="proy-total-badge">(0)</span>
            </h2>
          </div>
          <div class="area-proyectos-header-controls">
            <a href="proyectos.html" class="area-ver-todos-link" id="area-ver-todos-proy-link">
              Ver todos los proyectos <i class="fa-solid fa-arrow-right"></i>
            </a>
            <div class="proyectos-per-page-wrapper">
              <label for="area-proy-per-page" class="proy-per-page-label">Mostrar:</label>
              <select id="area-proy-per-page" class="proy-per-page-select">
                <option value="5" selected>5</option>
                <option value="7">7</option>
                <option value="10">10</option>
              </select>
              <span class="proy-per-page-suffix">por página</span>
            </div>
          </div>
        </div>

        <!-- Contenedor en Lista Limpia -->
        <div class="perfil-proyectos-list" id="area-proyectos-list">
          <!-- Filas renderizadas dinámicamente -->
        </div>

        <!-- Barra de Paginación -->
        <div class="proyectos-pagination-bar" id="area-proyectos-pagination"></div>
      </div>
    </section>

  </main>

  <!-- Componente Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="../scripts/loadComponents.js"></script>
  <script src="../scripts/area.js"></script>
</body>
</html>
