<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Investigación - Red BI4DT</title>
  <meta name="description" content="Perfil de investigador de la Red BI4DT: líneas de investigación, proyectos relacionados y contacto.">
  <link rel="stylesheet" href="../styles/index.css">
  <link rel="stylesheet" href="../styles/quienes.css">
  <link rel="stylesheet" href="../styles/investigacion.css">
</head>
<body>

  <!-- Componente Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Contenido Principal -->
  <main class="page-content">

    <!-- Hero: Foto + Descripción -->
    <section class="perfil-hero-section">
      <div class="perfil-hero-container">
        <div class="perfil-hero-img-wrapper">
          <img src="" class="perfil-hero-img" id="perfil-foto">
          <div class="perfil-hero-img-overlay"></div>
        </div>
        <div class="perfil-hero-info">
          <span class="perfil-label" id="perfil-categoria">EQUIPO DE INVESTIGACIÓN</span>
          <h1 class="perfil-nombre" id="perfil-nombre">Cargando...</h1>
          <p class="perfil-cargo" id="perfil-cargo"></p>
          <p class="perfil-institucion" id="perfil-institucion"></p>
          <p class="perfil-descripcion" id="perfil-descripcion"></p>
        </div>
      </div>
    </section>

    <!-- Líneas de Investigación -->
    <section class="perfil-lineas-section">
      <div class="perfil-section-container">
        <h2 class="perfil-section-title">
          <i class="fa-solid fa-microscope"></i> Líneas de Investigación
        </h2>
        <ul class="perfil-lineas-list" id="perfil-lineas"></ul>
      </div>
    </section>

    <!-- Proyectos Relacionados -->
    <section class="perfil-proyectos-section">
      <div class="perfil-section-container">
        <h2 class="perfil-section-title">
          <i class="fa-solid fa-folder-open"></i> Proyectos Relacionados
        </h2>
        <div class="perfil-proyectos-grid" id="perfil-proyectos"></div>
      </div>
    </section>

    <!-- Contacto -->
    <section class="perfil-contacto-section">
      <div class="perfil-section-container">
        <h2 class="perfil-section-title">
          <i class="fa-solid fa-envelope"></i> Contacto
        </h2>
        <div class="perfil-contacto-links" id="perfil-contacto"></div>
      </div>
    </section>

  </main>

  <!-- Componente Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="../scripts/loadComponents.js"></script>
  <script src="../scripts/investigacion.js"></script>
</body>
</html>
