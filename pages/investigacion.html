<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BI4DT Network</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/png" href="../assets/images/logo_red/logo_icon.png">
  <link rel="stylesheet" href="../styles/index.css">
  <link rel="stylesheet" href="../styles/investigacion.css?v=2.7">
</head>
<body>

  <!-- Componente Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Contenido Principal -->
  <main class="page-content">

    <!-- Hero: Foto + Contenido + Líneas de Investigación -->
    <section class="perfil-hero-section">
      <div class="perfil-hero-container">
        <!-- Columna 1: Foto fija 300x300 -->
        <div class="perfil-hero-img-wrapper">
          <img src="" class="perfil-hero-img" id="perfil-foto">
          <div class="perfil-hero-img-overlay"></div>
        </div>

        <!-- Columna 2 (Arriba): Nombre, Institución, Descripción -->
        <div class="perfil-hero-main-info">
          <h1 class="perfil-nombre" id="perfil-nombre">&nbsp;</h1>
          <p class="perfil-institucion" id="perfil-institucion"></p>
          <p class="perfil-descripcion" id="perfil-descripcion"></p>
        </div>

        <!-- Columna 3: Líneas de Investigación -->
        <div class="perfil-hero-lineas-col">
          <h3 class="perfil-lineas-title" data-i18n="investigacion.lineas_investigacion">Líneas de Investigación</h3>
          <ul class="perfil-lineas-bullet-list" id="perfil-chips"></ul>
        </div>

        <!-- Columna 2 (Abajo): Íconos de contacto anclados a la base -->
        <div class="perfil-contacto-links" id="perfil-contacto"></div>
      </div>
    </section>

    <!-- Proyectos Relacionados (Vista en Lista Limpia) -->
    <section class="perfil-proyectos-section">
      <div class="perfil-section-container">
        <div class="perfil-proyectos-header-bar">
          <h2 class="section-title-navy perfil-section-title">
            <span data-i18n="investigacion.proyectos_relacionados">Proyectos Relacionados</span> <span id="proyectos-total-badge" class="proy-total-badge">(0)</span>
          </h2>
          <div class="proyectos-per-page-wrapper">
            <label for="proy-per-page" class="proy-per-page-label" data-i18n="investigacion.mostrar">Mostrar:</label>
            <select id="proy-per-page" class="proy-per-page-select">
              <option value="5" selected>5</option>
              <option value="7">7</option>
              <option value="10">10</option>
            </select>
            <span class="proy-per-page-suffix" data-i18n="investigacion.por_pagina">por página</span>
          </div>
        </div>

        <!-- Contenedor Lista -->
        <div class="perfil-proyectos-list" id="perfil-proyectos"></div>

        <!-- Barra de Paginación -->
        <div class="proyectos-pagination-bar" id="proyectos-pagination"></div>
      </div>
    </section>

  </main>

  <!-- Componente Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="../scripts/i18n.js"></script>
  <script src="../scripts/loadComponents.js"></script>
  <script src="../scripts/investigacion.js?v=2.7"></script>
</body>
</html>
