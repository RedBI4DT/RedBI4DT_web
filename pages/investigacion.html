<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Investigación - Red BI4DT</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/png" href="../assets/images/logo_red/logo_icon.png">
  <link rel="stylesheet" href="../styles/index.css">
  <link rel="stylesheet" href="../styles/quienes.css">
  <link rel="stylesheet" href="../styles/investigacion.css">
</head>
<body>

  <!-- Componente Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Contenido Principal -->
  <main class="page-content">

    <!-- Hero: Foto + Contenido + Líneas de Investigación -->
    <section class="perfil-hero-section">
      <div class="perfil-hero-container">
        <!-- Columna 1: Foto fija 300x300 -->
        <div class="perfil-hero-img-wrapper">
          <img src="" class="perfil-hero-img" id="perfil-foto">
          <div class="perfil-hero-img-overlay"></div>
        </div>

        <!-- Columna 2 (Arriba): Nombre, Institución, Descripción -->
        <div class="perfil-hero-main-info">
          <h1 class="perfil-nombre" id="perfil-nombre">&nbsp;</h1>
          <p class="perfil-institucion" id="perfil-institucion"></p>
          <p class="perfil-descripcion" id="perfil-descripcion"></p>
        </div>

        <!-- Columna 3: Líneas de Investigación -->
        <div class="perfil-hero-lineas-col">
          <h3 class="perfil-lineas-title">Líneas de Investigación</h3>
          <ul class="perfil-lineas-bullet-list" id="perfil-chips"></ul>
        </div>

        <!-- Columna 2 (Abajo): Íconos de contacto anclados a la base -->
        <div class="perfil-contacto-links" id="perfil-contacto"></div>
      </div>
    </section>

    <!-- Proyectos Relacionados (Cards mínimas) -->
    <section class="perfil-proyectos-section">
      <div class="perfil-section-container">
        <h2 class="perfil-section-title">
          <i class="fa-solid fa-folder-open"></i> Proyectos Relacionados
        </h2>
        <div class="perfil-proyectos-grid" id="perfil-proyectos"></div>
      </div>
    </section>

  </main>

  <!-- Componente Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="../scripts/loadComponents.js"></script>
  <script src="../scripts/investigacion.js"></script>
</body>
</html>
