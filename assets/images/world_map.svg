<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Fondo océano con degradado tecnológico -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </linearGradient>

    <!-- Resplandor sutil centrado en las Américas -->
    <radialGradient id="americasGlow" cx="28%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Patrón de puntos de malla tecnológica -->
    <pattern id="techGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="12.5" cy="12.5" r="0.75" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>

    <!-- Estilo de Continentes -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172236"/>
    </linearGradient>
  </defs>

  <!-- Fondo base del mapa -->
  <rect width="1000" height="520" fill="url(#oceanGrad)"/>
  <rect width="1000" height="520" fill="url(#americasGlow)"/>
  <rect width="1000" height="520" fill="url(#techGrid)"/>

  <!-- Líneas Cartográficas (Latitud y Longitud) -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="0.8" stroke-dasharray="4,6">
    <!-- Paralelos principales -->
    <line x1="0" y1="130" x2="1000" y2="130"/> <!-- ~45° N -->
    <line x1="0" y1="260" x2="1000" y2="260" stroke="rgba(56,189,248,0.2)" stroke-width="1.2" stroke-dasharray="6,4"/> <!-- Ecuador -->
    <line x1="0" y1="390" x2="1000" y2="390"/> <!-- ~45° S -->
    
    <!-- Meridianos principales -->
    <line x1="125" y1="0" x2="125" y2="520"/>
    <line x1="250" y1="0" x2="250" y2="520"/>
    <line x1="375" y1="0" x2="375" y2="520"/>
    <line x1="500" y1="0" x2="500" y2="520" stroke="rgba(56,189,248,0.18)" stroke-width="1.1"/> <!-- Meridiano 0° -->
    <line x1="625" y1="0" x2="625" y2="520"/>
    <line x1="750" y1="0" x2="750" y2="520"/>
    <line x1="875" y1="0" x2="875" y2="520"/>
  </g>

  <!-- Continentes Vectoriales -->
  <g fill="url(#landGrad)" stroke="#334155" stroke-width="1" stroke-linejoin="round">
    
    <!-- América del Norte -->
    <path d="M 120,45 
             L 155,42 195,50 240,48 275,60 260,85 240,105 285,115 305,95 330,120 310,145 280,150 
             260,185 245,215 225,230 205,245 195,270 190,295 180,305 170,290 175,260 160,250 
             145,220 130,200 120,165 105,150 90,140 75,110 85,90 110,65 Z"/>
    
    <!-- Groenlandia -->
    <path d="M 330,35 L 380,30 405,55 385,85 350,90 330,70 Z"/>

    <!-- Caribe / Islas -->
    <circle cx="265" cy="245" r="4" fill="#1e293b"/>
    <circle cx="280" cy="252" r="3.5" fill="#1e293b"/>
    <circle cx="295" cy="260" r="3" fill="#1e293b"/>

    <!-- Centroamérica -->
    <path d="M 190,295 L 205,300 220,315 235,325 245,335 240,342 225,332 210,320 195,305 Z"/>

    <!-- América del Sur -->
    <path d="M 245,335 
             L 275,330 310,335 345,350 365,375 375,405 360,430 335,460 305,485 285,505 
             275,500 280,470 270,440 260,400 255,370 245,355 240,342 Z"/>

    <!-- Europa -->
    <path d="M 470,80 
             L 510,75 540,85 570,80 575,110 550,135 520,140 500,165 470,170 455,145 
             445,120 455,95 Z"/>
    <!-- Reino Unido e Irlanda -->
    <path d="M 440,105 L 452,100 450,120 438,125 Z"/>
    <path d="M 428,112 L 435,110 433,122 426,120 Z"/>
    <!-- Escandinavia -->
    <path d="M 500,50 L 535,45 545,75 525,100 510,75 Z"/>

    <!-- África -->
    <path d="M 460,185 
             L 505,180 555,190 595,225 605,265 590,305 570,350 550,395 530,425 
             505,410 490,370 480,320 450,270 440,230 450,200 Z"/>
    <!-- Madagascar -->
    <path d="M 605,370 L 618,360 622,395 610,405 Z"/>

    <!-- Asia -->
    <path d="M 575,80 
             L 640,65 710,60 780,70 850,85 890,110 880,145 845,170 805,175 
             765,195 720,230 670,240 635,215 605,195 580,150 575,110 Z"/>
    
    <!-- India -->
    <path d="M 680,215 L 720,225 710,275 690,295 675,255 Z"/>

    <!-- Sudeste Asiático e Islas -->
    <path d="M 740,240 L 775,245 765,285 745,275 Z"/>
    <circle cx="785" cy="310" r="8" fill="#1e293b"/>
    <circle cx="810" cy="320" r="12" fill="#1e293b"/>
    <circle cx="845" cy="315" r="9" fill="#1e293b"/>
    <circle cx="835" cy="270" r="6" fill="#1e293b"/>
    <circle cx="870" cy="180" r="7" fill="#1e293b"/> <!-- Japón -->

    <!-- Australia y Oceanía -->
    <path d="M 800,380 
             L 860,370 900,395 895,440 855,465 810,450 785,415 Z"/>
    <path d="M 915,450 L 930,445 925,480 910,475 Z"/> <!-- Nueva Zelanda -->

  </g>

  <!-- Efecto de viñeta y relieve sutil -->
  <rect width="1000" height="520" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>
</svg>
